interface:
  display_name: 个人摄影美化与调色
  short_description: 自主选风格，统筹构图光色，非人像成片与可靠版本交付
  default_prompt: 使用 $photo-finish 处理风光、城市夜景、建筑、旅行、静物、美食或产品照片，偶然入镜人物只保护不美化；先读取当次要求和已保存的全局指令，再检索并查看个人风格库中的适用参考；之后自主选出最能表达原片的风格，统筹构图、画幅、光影、色彩与质感，不默认保持构图或只调色；可按需借鉴目录或独立设计，按当次限制、真实能力和内容保护执行，默认逐张直接显示一张正式成片，不附参数、过程、版本说明或返工提示；版本与保存凭据内部保留，异常状态如实简短说明，支持局部精修和只读回退。
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
