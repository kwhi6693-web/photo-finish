interface:
  display_name: 个人摄影美化与调色
  short_description: 非人像专业修图，先检索个人风格并遵守可选全局指令
  default_prompt: 使用 $photo-finish 处理风光、城市夜景、建筑、旅行、静物、美食或产品照片，偶然入镜人物只保护不美化；先读取当次要求和已保存的全局指令，再检索并查看个人风格库中的适用参考；之后结合专业后期摄影美学确定构图、光影和色彩，未限定部分自主判断，逐张交付最终成片及简短版本、真实保存状态；首次交付附一行可选返工提示，支持局部精修和只读回退。
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
