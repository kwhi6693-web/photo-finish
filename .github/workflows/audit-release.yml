name: Audit published release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  source-installer-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify tagged source, manifest, installer and actual published attachments
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/verify_packages.py published --tag "$RELEASE_TAG"
