name: Export public v2 native source for isolated private read-only trial
on:
  push:
    branches:
      - integration/photo-finish-v2-20261104
    paths:
      - .github/workflows/export-v2-native-code-once.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source-only allowlist and produce a private-host execution archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, tarfile
          root=Path.cwd()
          files=sorted(list((root/'runtime/10_SYSTEM_CONFIG/scripts').glob('*.py'))+
                       [root/'scripts/run_photo_finish.py'])
          assert len(files)>20
          for f in files:
              assert f.is_file() and not f.is_symlink()
              assert f.suffix=='.py' and f.stat().st_size < 200_000
          output=Path('/tmp/pf-v2-code.tar.gz')
          with tarfile.open(output,'w:gz') as tar:
              for file in files:
                  tar.add(file,arcname=file.relative_to(root).as_posix(),recursive=False)
          manifest={str(f.relative_to(root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in files}
          Path('/tmp/pf-v2-code-manifest.json').write_text(json.dumps({'sha':manifest,'purpose':'private source-only v2 test; no photos or secrets','commit':__import__('os').environ['GITHUB_SHA']},sort_keys=True,indent=2))
          print('allowlisted source files',len(files),'archive bytes',output.stat().st_size)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: photo-finish-v2-native-public-code-only
          path: |
            /tmp/pf-v2-code.tar.gz
            /tmp/pf-v2-code-manifest.json
          if-no-files-found: error
          retention-days: 1
