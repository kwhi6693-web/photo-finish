name: Validate skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }}, ${{ matrix.python }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            profile: core
            requirements: requirements.txt
          - os: ubuntu-latest
            python: '3.12'
            profile: core
            requirements: requirements.txt
          - os: windows-latest
            python: '3.12'
            profile: core
            requirements: requirements.txt
          - os: macos-latest
            python: '3.12'
            profile: core
            requirements: requirements.txt
          - os: ubuntu-latest
            python: '3.10'
            profile: analysis
            requirements: requirements-analysis.txt
          - os: ubuntu-latest
            python: '3.12'
            profile: analysis
            requirements: requirements-analysis.txt
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pip check
      - name: Exercise optional numerical analysis
        if: matrix.profile == 'analysis'
        shell: python
        run: |
          import importlib.metadata, math, sys
          sys.path.insert(0, 'runtime/10_SYSTEM_CONFIG/scripts')
          from PIL import Image
          from color_metrics import measure, phash
          colors = [(210, 80, 40), (40, 160, 80), (40, 90, 210),
                    (220, 190, 80), (120, 60, 160), (30, 40, 50)]
          image = Image.new('RGB', (72, 72))
          image.putdata([colors[(x // 12 + y // 12) % 6]
                         for y in range(72) for x in range(72)])
          result = measure(image)
          assert result['pixels'] == 5184
          assert len(result['palette_lab_kmeans6']) == 6
          assert math.isclose(sum(p['sample_fraction'] for p in result['palette_lab_kmeans6']), 1)
          fingerprint = phash(image)
          assert len(fingerprint) == 63 and set(fingerprint) <= {'0', '1'}
          print({name: importlib.metadata.version(name) for name in ('Pillow', 'numpy', 'scipy')})
      - run: python tools/doctor.py
      - run: python tools/check_publication.py --history
      - name: Windows checkpoint durability regression
        if: runner.os == 'Windows'
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, '.')
          sys.path.insert(0, 'runtime/10_SYSTEM_CONFIG/scripts')
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_private_checkpoint')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print({'tests': result.testsRun, 'skips': len(result.skipped),
                 'failures': len(result.failures), 'errors': len(result.errors)})
          sys.exit(not result.wasSuccessful())
      - run: python tools/run_tests.py
      - name: Windows symlink and temporary-alias diagnostics
        if: runner.os == 'Windows'
        shell: python
        run: |
          import sys, unittest
          sys.path.insert(0, '.')
          sys.path.insert(0, 'runtime/10_SYSTEM_CONFIG/scripts')
          names = [
            'verify_input_delivery_safety.DownloadSafetyTests.test_dangling_symlink_is_an_existing_target',
            'verify_input_delivery_safety.InputBindingTests.test_fetch_rejects_dangling_alias_before_network',
            'verify_input_delivery_safety.InputBindingTests.test_reference_symlink_retarget_is_detected',
            'tests.test_personal_backup.PersonalBackupTests.test_backup_validation_handles_temporary_directory_alias',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print({'tests': result.testsRun, 'skips': len(result.skipped),
                 'failures': len(result.failures), 'errors': len(result.errors)})
          sys.exit(not result.wasSuccessful())
      - name: Protect frozen v1.5.0 archive and tagged source mapping
        run: python tools/verify_packages.py stable
      - name: Protect released v1.5.1 tag, source, canonical bytes and staged mapping
        run: python tools/verify_packages.py released
      - name: Verify isolated deterministic development candidate
        run: python tools/verify_packages.py candidate
      - name: Verify current-source deterministic candidate and isolated installed protocols
        run: python tools/verify_release_preparation.py --candidate
      - name: Verify staged unpublished v1.5.5 release candidate
        run: python tools/verify_release_preparation.py
      - name: Verify frozen v1.5.4 from its tagged source
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory(prefix='photo-finish-frozen-') as tmp:
              checkout = pathlib.Path(tmp) / 'release'
              subprocess.run(['git', 'worktree', 'add', '--detach', str(checkout), 'v1.5.4'], check=True)
              try:
                  subprocess.run([sys.executable, str(checkout / 'tools/verify_release_preparation.py')], cwd=checkout, check=True)
              finally:
                  subprocess.run(['git', 'worktree', 'remove', '--force', str(checkout)], check=True)
      - run: git diff --exit-code -- dist
